name: verify

# Independent Lean verification of the 2026 Navier-Stokes / Euler claims.
# Clones upstream repos at pinned SHAs. No code is ever modified:
# the build log + commit SHA are the entire deliverable.

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Git URL of the Lean repo to verify"
        required: true
        default: "https://github.com/openai/NavierStokesAndEuler"
      pinned_sha:
        description: "Commit SHA to verify (empty = default branch HEAD)"
        required: false
        default: ""
      axiom_targets:
        description: "Space-separated Lean constants for #print axioms (empty = skip)"
        required: false
        default: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Provenance
        run: |
          {
            echo "verifier: Wagar Machine LLC Continuous Verification Bureau"
            echo "runner: ${RUNNER_NAME} (${RUNNER_OS} $(uname -m))"
            echo "started_utc: $(date -u +%FT%TZ)"
          } | tee provenance.txt

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Checkout upstream at pinned SHA
        run: |
          git clone "${{ inputs.repo_url }}" target
          cd target
          if [ -n "${{ inputs.pinned_sha }}" ]; then
            git checkout "${{ inputs.pinned_sha }}"
          fi
          git rev-parse HEAD | tee ../commit.txt
          git log -1 --format='%H %ci %an: %s' | tee -a ../commit.txt
          echo "toolchain: $(cat lean-toolchain)" | tee -a ../provenance.txt

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: target/.lake
          key: lake-${{ inputs.repo_url }}-${{ hashFiles('target/lean-toolchain') }}
          restore-keys: lake-${{ inputs.repo_url }}-

      - name: Fetch Mathlib cache
        working-directory: target
        run: lake exe cache get! 2>&1 | tail -5

      - name: Build (this is the actual verification)
        working-directory: target
        run: |
          set -o pipefail
          lake build 2>&1 | tee ../build.log

      - name: Axiom audit
        if: ${{ inputs.axiom_targets != '' }}
        working-directory: target
        run: |
          case "${{ inputs.repo_url }}" in
            *NavierStokesAndEuler*) ROOT="NavierStokes" ;;
            *fluid_lean*) ROOT="EulerBlowup.Num.Cert.FinalPrime" ;;
          esac
          {
            echo "import $ROOT"
            for t in ${{ inputs.axiom_targets }}; do
              echo "#print axioms $t"
            done
          } > AxiomAudit.lean
          lake env lean AxiomAudit.lean 2>&1 | tee ../axioms.log

      - name: Verdict
        if: success()
        run: |
          {
            echo "VERDICT: BUILD_OK"
            echo "commit: $(head -1 commit.txt)"
            echo "finished_utc: $(date -u +%FT%TZ)"
          } | tee verdict.txt

      - name: Verdict on failure
        if: failure()
        run: |
          echo "VERDICT: BUILD_FAILED" | tee verdict.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: |
            build.log
            axioms.log
            commit.txt
            provenance.txt
            verdict.txt
          if-no-files-found: warn
